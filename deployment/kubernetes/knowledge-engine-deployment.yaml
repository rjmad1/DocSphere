apiVersion: apps/v1
kind: Deployment
metadata:
  name: ekos-knowledge-engine
  namespace: ekos-platform
  labels:
    app: knowledge-engine
    tier: backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: knowledge-engine
  template:
    metadata:
      labels:
        app: knowledge-engine
    spec:
      containers:
      - name: graph-service
        image: ekos/knowledge-engine:v1.0.0
        ports:
        - containerPort: 8000
        env:
        - name: NEO4J_URI
          value: "bolt://neo4j-service.ekos-platform.svc.cluster.local:7687"
        - name: QDRANT_HOST
          value: "qdrant-service.ekos-platform.svc.cluster.local"
        resources:
          limits:
            cpu: "2000m"
            memory: "4Gi"
          requests:
            cpu: "500m"
            memory: "1Gi"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 15
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: knowledge-engine-service
  namespace: ekos-platform
spec:
  type: ClusterIP
  ports:
  - port: 8000
    targetPort: 8000
  selector:
    app: knowledge-engine
