name: EKOS Production CI/CD Pipeline

on:
  push:
    branches: [ main, release/* ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: "pip"

    - name: Install Linting Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install ruff mypy

    - name: Lint with Ruff
      run: python -m ruff check backend/ --output-format=github

    - name: Type Check with Mypy
      run: python -m mypy backend/ --ignore-missing-imports --no-error-summary
      continue-on-error: true   # non-blocking until type annotations are complete

  security-scan:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: "pip"

    - name: Install Security Tools
      run: |
        python -m pip install --upgrade pip
        pip install bandit safety pip-audit

    - name: Run Bandit SAST Scan
      run: |
        python -m bandit -r backend/ \
          -ll \
          --exclude backend/tests \
          -f json -o bandit-report.json || true
        python -m bandit -r backend/ \
          -ll \
          --exclude backend/tests

    - name: Upload Bandit Report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: bandit-report
        path: bandit-report.json

    - name: Dependency Vulnerability Scan (pip-audit)
      run: |
        pip install -r requirements.txt
        python -m pip_audit --requirement requirements.txt --format markdown
      continue-on-error: true

  test:
    name: Tests & Coverage
    runs-on: ubuntu-latest
    env:
      EKOS_BYPASS_AUTH_IN_TESTS: "true"
      EKOS_MASTER_KEY: "test_master_key_32b_for_ci_testing_"
      EKOS_JWT_SECRET: "test_jwt_secret_32b_for_ci_testing__"

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: "pip"

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest-cov pytest-asyncio

    - name: Run Tests with Coverage
      run: |
        python -m pytest backend/tests/ \
          -v \
          --tb=short \
          --cov=backend \
          --cov-report=term-missing \
          --cov-report=xml:coverage.xml \
          --cov-report=html:htmlcov \
          --cov-fail-under=60

    - name: Upload Coverage Report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: coverage-report
        path: |
          coverage.xml
          htmlcov/

    - name: Upload Coverage to Codecov
      uses: codecov/codecov-action@v4
      if: always()
      with:
        file: coverage.xml
        fail_ci_if_error: false

  docker-build:
    name: Docker Build Validation
    runs-on: ubuntu-latest
    needs: [test]
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Docker Image
      uses: docker/build-push-action@v6
      with:
        context: .
        push: false
        tags: ekos-backend:${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
