name: EKOS Production CI/CD Pipeline

on:
  push:
    branches: [ main, release/* ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-validate:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install fastapi uvicorn pydantic sqlalchemy jinja2 prometheus-client requests httpx

    - name: Run Backend Unit & Integration Tests
      run: |
        python -m unittest discover -s backend/tests

    - name: Execute End-to-End System Verification
      run: |
        python scripts/verify_production_e2e.py
        python scripts/verify_enterprise_integrations.py
        python scripts/verify_full_system_readiness.py
